<!DOCTYPE html>
<html lang="en">
<head>
    <!-- index.html -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel PMS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/workspace.css">
</head>
<body>

    <div id="pageHeaderBar" class="page-header-bar"></div>
    <div id="wsContent" class="ws-content"></div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/pageHeader.js"></script>
    <script src="js/workspace.js"></script>
    <script src="js/sidebar.js"></script>

    <script>
        // filename -> sidebar item id, biar highlight sidebar tetep nyambung
        // walau bukan dibuka lewat klik sidebar (mis. bounce dari halaman lain)
        const PH_PAGE_IDS = {
            "index.html": "nav-dashboard",
            "reservation.html": "nav-reservations",
            "room.html": "nav-rooms",
            "guest.html": "nav-guests"
        };

        function phHumanize(file) {
            return file.replace(/\.html.*$/, "").replace(/-/g, " ")
                .replace(/\b\w/g, c => c.toUpperCase());
        }

        initPageHeader();
        initSidebar();

        const openParam = new URLSearchParams(location.search).get("open") || "reservation.html";
        const bareFile = openParam.split("?")[0];

        Workspace.openTab({
            title: PH_PAGE_IDS[bareFile] ? phHumanize(bareFile) : phHumanize(bareFile),
            url: openParam,
            page: PH_PAGE_IDS[bareFile] || ("page-" + bareFile)
        });
    </script>

</body>
</html>
